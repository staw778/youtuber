<!DOCTYPE html>
<html lang="en-us">

<head>

    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">

    <title>Unity Web Player | Youtuber</title>

    <style>

        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: black;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #unity-canvas {
            display: block;
            background: #231F20;
        }

    </style>

</head>

<body>

    <canvas
        id="unity-canvas"
        width="1920"
        height="1080"
        tabindex="-1">
    </canvas>

    <script src="Build/Export.loader.js"></script>

    <script>

        function resizeCanvas() {

            const canvas = document.querySelector("#unity-canvas");

            const windowWidth = window.innerWidth;
            const windowHeight = window.innerHeight;

            // Unity 原始比例
            const gameAspect = 1920 / 1080;

            // 瀏覽器比例
            const windowAspect = windowWidth / windowHeight;

            let width;
            let height;

            if (windowAspect > gameAspect) {

                // 瀏覽器比遊戲寬
                // 以高度為基準
                height = windowHeight;
                width = height * gameAspect;

            }
            else {

                // 瀏覽器比遊戲高
                // 以寬度為基準
                width = windowWidth;
                height = width / gameAspect;

            }

            canvas.style.width = width + "px";
            canvas.style.height = height + "px";
        }


        // 視窗大小改變時重新計算
        window.addEventListener("resize", resizeCanvas);

        // 第一次載入
        resizeCanvas();


        // Mobile
        if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {

            var meta = document.createElement('meta');

            meta.name = 'viewport';

            meta.content =
                'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';

            document.getElementsByTagName('head')[0].appendChild(meta);

        }


        createUnityInstance(
            document.querySelector("#unity-canvas"),
            {
                arguments: [],

                dataUrl: "Build/Export.data.br",
                frameworkUrl: "Build/Export.framework.js.br",
                codeUrl: "Build/Export.wasm.br",
                streamingAssetsUrl: "StreamingAssets",

                companyName: "DefaultCompany",
                productName: "Youtuber",
                productVersion: "1.0",

            }
        ).then((unityInstance) => {

        }).catch((message) => {

            alert(message);

        });

    </script>

</body>

</html>
