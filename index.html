<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>YouTuber 訂閱模擬器</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<button id="deleteGame" title="刪除全部存檔">刪除頻道</button>
<button id="themeToggle" class="theme-toggle" title="切換成深色模式">☾</button>

<div class="game">
  <section class="left-panel">
    <div class="profile-orbit">
      <div class="profile-wrap" title="點擊更換玩家大頭貼">
        <img id="profileImage" class="profile-image" src="assets/default_avatar.png" alt="玩家大頭貼">
        <input id="profileInput" type="file" accept="image/*" hidden>
      </div>
      <div class="medal-title">訂閱獎牌</div>
      <div class="medals">
        <div class="medal"><img id="medal100k" src="assets/medals/100k.png"><span>10萬</span></div>
        <div class="medal"><img id="medal1m" src="assets/medals/1m.png"><span>100萬</span></div>
        <div class="medal"><img id="medal10m" src="assets/medals/10m.png"><span>1000萬</span></div>
        <div class="medal"><img id="medal50m" src="assets/medals/50m.png"><span>5000萬</span></div>
        <div class="medal"><img id="medal100m" src="assets/medals/100m.png"><span>1億</span></div>
      </div>
    </div>

    <input id="channelName" class="channel-name" value="我的頻道" maxlength="30" aria-label="頻道名稱">

    <div class="subscriber-count"><span id="subscriberCount">0</span> 位訂閱者</div>
    <div class="cps">每秒：<span id="cps">0</span></div>

    <button id="subscribeButton" class="subscribe-button">訂閱</button>

    <div class="event-box">
      <div class="event-heading">事件</div>
      <div id="eventText">你的人生充滿了未知的可能。</div>
    </div>

    <button id="eventButton" class="event-button">
      <span id="eventFill"></span>
      <span class="event-button-text">抽事件卡</span>
    </button>
  </section>

  <section class="right-panel">
    <div class="click-upgrades">
      <button type="button" id="doubleClick" class="upgrade-card">
        <img src="assets/blue_finger.png" alt="藍色點擊升級">
        <div><b>×2</b><small>點擊功率 ×2</small><em>100 訂閱</em></div>
      </button>
      <button type="button" id="quadClick" class="upgrade-card">
        <img src="assets/red_finger.png" alt="紅色點擊升級">
        <div><b>×4</b><small>點擊功率 ×4</small><em>1,000 訂閱</em></div>
      </button>
    </div>

    <div class="shop-title">YOUTUBER</div>
    <div id="youtuberList" class="youtuber-list"></div>
  </section>
</div>

<div id="toast"></div>
<script src="game.js"></script>
</body>
</html>
