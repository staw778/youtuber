<!DOCTYPE html>
<html lang="en-us">
<head>
  <meta charset="utf-8">
  <title>Unity Web Player | Youtuber</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background-color: black;
    }
    #unity-canvas {
      display: block;
      background: #231F20;
      margin: 0 auto; /* 水平置中，左右可留白 */
    }
  </style>
</head>
<body>
  <canvas id="unity-canvas" width="1920" height="1080" tabindex="-1"></canvas>
  <script src="Build/Export.loader.js"></script>
  <script>
    function resizeCanvas() {
      const canvas = document.querySelector("#unity-canvas");
      const windowWidth = window.innerWidth;
      const windowHeight = window.innerHeight;

      const gameAspect = 1920 / 1080;
      const windowAspect = windowWidth / windowHeight;

      let width, height;
      if (windowAspect > gameAspect) {
        // 瀏覽器比遊戲寬 → 以高度為基準
        height = windowHeight;
        width = height * gameAspect;
      } else {
        // 瀏覽器比遊戲高 → 以寬度為基準
        width = windowWidth;
        height = width / gameAspect;
      }

      canvas.style.width = width + "px";
      canvas.style.height = height + "px";
    }

    window.addEventListener("resize", resizeCanvas);
    resizeCanvas();

    createUnityInstance(document.querySelector("#unity-canvas"), {
      dataUrl: "Build/Export.data",
      frameworkUrl: "Build/Export.framework.js",
      codeUrl: "Build/Export.wasm",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "DefaultCompany",
      productName: "Youtuber",
      productVersion: "1.0",
      matchWebGLToCanvasSize: true
    }).catch((message) => {
      alert(message);
    });
  </script>
</body>
</html>
